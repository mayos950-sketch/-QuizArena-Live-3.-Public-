<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#061522">
<title>QuizArena Live</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#061522;--panel:#0f2d43;--text:#f5f8fb;--muted:#9eb5c6;--cyan:#28b8ff;--green:#20c66b;--gold:#ffc84a;--danger:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#061522,#0c2e43);color:var(--text);font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;margin:14px 0}
.btn{width:100%;padding:14px 16px;border:0;border-radius:14px;background:var(--cyan);color:white;font-weight:700;margin:7px 0;font-size:16px}.green{background:var(--green)}.gold{background:var(--gold);color:#18232c}.dark{background:#173b54}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #3b5c72;background:#0b2233;color:white;margin:6px 0;font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}.muted{color:var(--muted)}.center{text-align:center}.big{font-size:58px}.answer{width:100%;padding:14px;border:1px solid #42647b;border-radius:14px;background:#12344b;color:white;text-align:left;margin:7px 0;font-size:17px}.sel{outline:2px solid var(--gold)}
table{width:100%;border-collapse:collapse}td{padding:10px 5px;border-bottom:1px solid rgba(255,255,255,.1)}.rank{font-size:22px}.hidden{display:none!important}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#173b54;margin:2px;font-size:13px}
h1,h2,h3{margin-top:.3em}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://yqwfvdicuacvawwndpuz.supabase.co";
const SUPABASE_KEY = "sb_publishable_pAKBRapvgeV7XQMGcYgNEA_i5KhtiDe";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QUESTIONS = [
{difficulty:"easy",question:"Hva heter hovedstaden i Norge?",options:["Oslo","Bergen","Trondheim","Stavanger"],correct:"Oslo"},
{difficulty:"easy",question:"Hva er hovedstaden i Sverige?",options:["Stockholm","Göteborg","Malmö","Uppsala"],correct:"Stockholm"},
{difficulty:"easy",question:"Hvem malte «Skrik»?",options:["Edvard Munch","Harald Sohlberg","Christian Krohg","Theodor Kittelsen"],correct:"Edvard Munch"},
{difficulty:"easy",question:"Hvilken planet er nærmest solen?",options:["Merkur","Venus","Mars","Jorden"],correct:"Merkur"},
{difficulty:"easy",question:"Hvor mange spillere har et fotballag på banen samtidig?",options:["11","9","10","12"],correct:"11"},
{difficulty:"hard",question:"Hvilket land har hovedstaden Astana?",options:["Kasakhstan","Usbekistan","Kirgisistan","Mongolia"],correct:"Kasakhstan"},
{difficulty:"hard",question:"Hvilket grunnstoff har atomnummer 74?",options:["Wolfram","Titan","Kobolt","Molybden"],correct:"Wolfram"},
{difficulty:"hard",question:"Hvilket år ble unionen mellom Norge og Sverige oppløst?",options:["1905","1814","1918","1945"],correct:"1905"},
{difficulty:"hard",question:"Hva heter den dypeste kjente delen av verdenshavene?",options:["Challenger Deep","Puerto Rico-graven","Tonga-graven","Java-graven"],correct:"Challenger Deep"},
{difficulty:"hard",question:"Hvilken norsk forfatter fikk Nobelprisen i litteratur i 1920?",options:["Knut Hamsun","Sigrid Undset","Bjørnstjerne Bjørnson","Jon Fosse"],correct:"Knut Hamsun"}
];

const app=document.getElementById("app");
let timer=null, poll=null, state=null, selected="", seconds=15, startedAt=0;
const params=new URLSearchParams(location.search);
const playerToken=params.get("token");
const code=params.get("code");
const mode=playerToken&&code?"player":"home";

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}

function home(){
 app.innerHTML=`<main class="wrap">
 <div class="center"><div class="big">🌍❓🏆</div><h1>QuizArena Live</h1><p class="muted">Norge & verden · live med venner</p></div>
 <div class="card"><h2>Quizmaster</h2><p>Lett, vanskelig eller miks. Opptil 10 spillere.</p><button class="btn green" onclick="hostSetup()">Start som quizmaster</button></div>
 <div class="card"><h2>🏆 3 seire = personlig trofé</h2><p>Vinneren samler seire. Etter 3 seire kan trofé lastes ned som PNG.</p></div>
 <div class="card"><h2>Spiller</h2><p>Ingen app nødvendig. Spillere åpner invitasjonslenken i nettleseren.</p></div>
 </main>`;
}
function hostSetup(){
 app.innerHTML=`<main class="wrap"><div class="center"><div class="big">🎙️🌍</div><h1>QuizArena Live</h1></div>
 <div class="card"><h2>Ny live-runde</h2>
 <label>Vanskelighetsgrad</label><select id="diff"><option value="easy">Lett</option><option value="hard">Vanskelig</option><option value="mix" selected>Miks</option></select>
 <label>Tid per spørsmål</label><select id="limit"><option>10</option><option selected>15</option><option>20</option></select>
 <p class="muted">Anti-juks registrerer når spillersiden går i bakgrunnen.</p>
 <button class="btn green" onclick="createSession()">Opprett quiz</button></div></main>`;
}
async function createSession(){
 const diff=document.getElementById("diff").value, limit=Number(document.getElementById("limit").value);
 let pool=QUESTIONS.filter(q=>diff==="mix"||q.difficulty===diff);
 while(pool.length<10) pool=pool.concat(pool);
 pool=shuffle(pool).slice(0,10);
 const {data,error}=await sb.rpc("qa_create_session",{p_difficulty:diff,p_time_limit:limit,p_questions:pool});
 if(error){alert(error.message);return}
 localStorage.setItem("qa_host_token",data.host_token);
 location.href=location.pathname+"?host="+encodeURIComponent(data.host_token);
}
async function hostPage(token){
 clearInterval(poll);
 async function refresh(){
   const {data,error}=await sb.rpc("qa_host_state",{p_host_token:token});
   if(error||!data){app.innerHTML='<main class="wrap"><div class="card">Kunne ikke hente quiz.</div></main>';return}
   state=data; renderHost(token);
 }
 await refresh(); poll=setInterval(refresh,1000);
}
function renderHost(token){
 const s=state.session, ps=state.players||[];
 let html=`<main class="wrap"><div class="center"><div class="big">🎙️🌍</div><h1>QuizArena Live</h1></div>
 <div class="card"><div class="row"><div><div class="muted">Quizkode</div><h2>${esc(s.code)}</h2></div><div><div class="muted">Status</div><h3>${esc(s.status).toUpperCase()}</h3></div></div></div>`;
 if(s.status==="lobby"){
   html+=`<div class="card"><h3>Legg til spiller (${ps.length}/10)</h3><input id="pname" placeholder="Navn"><input id="pphone" placeholder="Telefonnummer (valgfritt)" inputmode="tel"><button class="btn" onclick="addPlayer('${esc(token)}')">Legg til spiller</button></div>
   <div class="card">${ps.map(p=>`<div style="margin-bottom:14px"><b>${esc(p.name)}</b> <span class="muted">${esc(p.phone||"")}</span><div class="muted">${p.wins||0} seire ${p.trophy_unlocked?"· 🏆":""}</div><button class="btn dark" onclick='sharePlayer(${JSON.stringify(JSON.stringify(p))})'>Send invitasjon</button></div>`).join("")||'<p class="muted">Ingen spillere ennå.</p>'}</div>
   <button class="btn green" ${ps.length?"":"disabled"} onclick="hostStart('${esc(token)}')">Start spørsmål 1</button>`;
 } else if(s.status==="live"){
   const all=ps.length&&ps.every(p=>p.answered_current);
   html+=`<div class="card"><h2>Spørsmål ${s.current_index+1} av 10</h2><p class="muted">${s.time_limit_seconds} sekunder</p></div>
   <div class="card"><h3>Svarstatus</h3>${ps.map(p=>`<div class="row" style="margin:9px 0"><span>${p.suspicious?"🚩 ":""}${esc(p.name)}</span><span style="text-align:right">${p.answered_current?"✅ Svart":"⏳ Venter"} ${p.tab_switch_count?`· ⚠️ ${p.tab_switch_count}`:""}</span></div>`).join("")}</div>
   <button class="btn gold" ${all?"":"disabled"} onclick="hostNext('${esc(token)}')">${s.current_index===9?"Vis resultat":"Neste spørsmål"}</button>`;
 } else {
   const sorted=[...ps].sort((a,b)=>b.score-a.score);
   html+=`<div class="card center"><div class="big">🏆🎉⭐</div><h1>GRATULERER!</h1>
   <table><tbody>${sorted.map((p,i)=>`<tr><td class="rank">${i===0?"🥇":i===1?"🥈":i===2?"🥉":"⭐"} ${i+1}.</td><td>${esc(p.name)}${s.winner_player_id===p.id?`<div class="muted">${p.wins||0} seire ${p.trophy_unlocked?"· 🏆 Trofé":""}</div>`:""}</td><td>${p.score}</td></tr>`).join("")}</tbody></table>
   <button class="btn green" onclick="localStorage.removeItem('qa_host_token');location.href=location.pathname">Ny runde</button></div>`;
 }
 html+=`</main>`; app.innerHTML=html;
}
async function addPlayer(token){
 const name=document.getElementById("pname").value.trim(), phone=document.getElementById("pphone").value.trim();
 if(!name)return;
 const {error}=await sb.rpc("qa_add_player",{p_host_token:token,p_name:name,p_phone:phone||null}); if(error)alert(error.message);
}
async function hostStart(token){const {error}=await sb.rpc("qa_host_start",{p_host_token:token});if(error)alert(error.message)}
async function hostNext(token){const {error}=await sb.rpc("qa_host_next",{p_host_token:token});if(error)alert(error.message)}
async function sharePlayer(raw){
 const p=JSON.parse(raw), s=state.session;
 const url=`${location.origin}${location.pathname}?code=${encodeURIComponent(s.code)}&token=${encodeURIComponent(p.player_token)}`;
 const text=`🌍 QuizArena Live\nHei ${p.name}! Spill her:\n${url}`;
 if(navigator.share) await navigator.share({text,url}); else {await navigator.clipboard.writeText(text);alert("Invitasjonen er kopiert.")}
}

async function playerPage(){
 clearInterval(poll);
 async function refresh(){
  const {data,error}=await sb.rpc("qa_player_state",{p_code:code,p_player_token:playerToken});
  if(error||!data){app.innerHTML='<main class="wrap"><div class="card">Ugyldig invitasjon.</div></main>';return}
  const old=state?.session?.current_index;
  state=data;
  if(old!==state.session.current_index){selected="";seconds=state.session.time_limit_seconds||15;startedAt=Date.now()}
  renderPlayer();
 }
 await refresh(); poll=setInterval(refresh,1000);
 document.addEventListener("visibilitychange",async()=>{if(document.hidden&&state?.session?.anti_cheat_enabled){await sb.rpc("qa_flag_switch",{p_code:code,p_player_token:playerToken})}});
}
function renderPlayer(){
 const s=state.session,p=state.player,q=state.question;
 if(s.status==="lobby"){app.innerHTML=`<main class="wrap"><div class="card center"><div class="big">⏳</div><h2>Hei, ${esc(p.name)}!</h2><p>Venter på quizmaster.</p><p class="muted">${p.wins||0} seire totalt</p></div></main>`;return}
 if(s.status==="finished"){renderResult();return}
 if(!timer){timer=setInterval(()=>{if(state?.session?.status==="live"&&!state?.player?.answered_current&&seconds>0){seconds--;const el=document.getElementById("sec");if(el){el.textContent=seconds;el.style.color=seconds<=5?"#ff6b6b":"#ffc84a"}}},1000)}
 app.innerHTML=`<main class="wrap"><div class="center"><h1>🌍 QuizArena</h1><p>Spørsmål ${s.current_index+1} av 10</p></div><div class="card">
 <div class="center"><div id="sec" style="font-size:40px;font-weight:800;color:${seconds<=5?"#ff6b6b":"#ffc84a"}">${seconds}</div><div class="muted">sekunder</div></div>
 <h2>${esc(q?.question||"Laster…")}</h2>
 ${(q?.options||[]).map(o=>`<button class="answer ${selected===o?"sel":""}" ${p.answered_current||seconds<=0?"disabled":""} onclick='selectAnswer(${JSON.stringify(o)})'>${esc(o)}</button>`).join("")}
 <button class="btn green" ${!selected||p.answered_current||seconds<=0?"disabled":""} onclick="sendAnswer()">${p.answered_current?"Svar sendt ✅":seconds<=0?"Tiden er ute":"Send svar"}</button>
 ${p.suspicious?'<p class="center" style="color:#ffb347">⚠️ Sidebytte er registrert.</p>':""}
 </div></main>`;
}
function selectAnswer(x){selected=x;renderPlayer()}
async function sendAnswer(){
 if(!selected||seconds<=0)return;
 const ms=Math.max(0,Date.now()-startedAt);
 const {error}=await sb.rpc("qa_submit_answer",{p_code:code,p_player_token:playerToken,p_answer:selected,p_response_ms:ms});
 if(error)alert(error.message);
}
function renderResult(){
 const p=state.player;
 if(p.is_winner) setTimeout(celebrate,200);
 app.innerHTML=`<main class="wrap"><div class="card center">
 <div style="font-size:86px">${p.is_winner?"🏆🎉⭐":p.rank===2?"🥈⭐":p.rank===3?"🥉⭐":"⭐"}</div>
 <h1>${p.is_winner?"GRATULERER!":"Godt spilt!"}</h1><h2>${esc(p.name)}</h2>
 ${p.is_winner?'<div style="font-size:30px;margin:12px 0">DU ER VINNEREN!</div>':""}
 <p style="font-size:22px">Plass ${p.rank} av ${p.total_players}</p><p style="font-size:22px">${p.score} poeng</p>
 ${p.is_winner?`<div class="card"><h2>${p.wins||0} seire totalt</h2>${p.trophy_unlocked?`<div style="font-size:72px">🏆</div><h2>QuizArena-trofé låst opp!</h2><button class="btn gold" onclick="downloadTrophy()">🏆 Last ned trofé</button>`:`<p class="muted">${Math.max(0,3-(p.wins||0))} seier(e) igjen til trofé.</p>`}</div><button class="btn green" onclick="celebrate()">🔊 Spill jubelen igjen</button>`:""}
 </div></main>`;
}
function celebrate(){
 try{
  const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),g=ctx.createGain();g.gain.value=.05;g.connect(ctx.destination);
  [523,659,784,1047].forEach((f,i)=>{const o=ctx.createOscillator();o.type="triangle";o.frequency.value=f;o.connect(g);o.start(ctx.currentTime+i*.13);o.stop(ctx.currentTime+i*.13+.22)});
  setTimeout(()=>ctx.close(),1000);
 }catch{}
 try{const u=new SpeechSynthesisUtterance(`Hurra! Gratulerer ${state.player.name}!`);u.lang="nb-NO";speechSynthesis.cancel();speechSynthesis.speak(u)}catch{}
}
function downloadTrophy(){
 const p=state.player,c=document.createElement("canvas");c.width=1400;c.height=1800;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,0,1800);
 g.addColorStop(0,"#071726");g.addColorStop(.55,"#0d3651");g.addColorStop(1,"#071726");x.fillStyle=g;x.fillRect(0,0,1400,1800);
 x.strokeStyle="#d9a93c";x.lineWidth=18;x.strokeRect(55,55,1290,1690);x.textAlign="center";x.fillStyle="#f3d477";x.font="bold 86px Arial";x.fillText("QUIZARENA",700,220);x.font="42px Arial";x.fillText("CHAMPION",700,290);x.font="220px Arial";x.fillText("🏆",700,610);
 x.fillStyle="#fff";x.font="bold 92px Arial";x.fillText(p.name,700,790);x.fillStyle="#f3d477";x.font="bold 62px Arial";x.fillText(`${p.wins} SEIRE`,700,920);x.fillStyle="#fff";x.font="46px Arial";x.fillText("Gratulerer med tre eller flere seire!",700,1040);
 x.fillStyle="#f3d477";x.font="72px Arial";x.fillText("★  ★  ★",700,1180);x.fillStyle="#c8d8e4";x.font="34px Arial";x.fillText("QuizArena Live · Norge & Verden",700,1450);x.fillStyle="#f3d477";x.font="42px Arial";x.fillText("HURRA!",700,1630);
 const a=document.createElement("a");a.download=`QuizArena_Trofe_${p.name.replace(/[^a-zA-Z0-9æøåÆØÅ_-]+/g,"_")}.png`;a.href=c.toDataURL("image/png");a.click();
}

const hostParam=params.get("host");
if(mode==="player") playerPage();
else if(hostParam) hostPage(hostParam);
else {
 const saved=localStorage.getItem("qa_host_token");
 if(saved) location.replace(location.pathname+"?host="+encodeURIComponent(saved)); else home();
}
</script>
</body>
</html>
