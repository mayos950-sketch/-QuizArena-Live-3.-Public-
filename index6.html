<style>
:root{
  --bg:#02070d; --panel:#07131f; --panel2:#0b1e2f; --line:#1d4b6d;
  --text:#f8fbff; --muted:#99aec2; --gold:#ffc23d; --gold2:#ff8b00;
  --blue:#0f91ff; --blue2:#0055a4; --green:#1fd75f; --red:#ff334d;
}
*{box-sizing:border-box}
html,body{
  margin:0; min-height:100%; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(20,92,160,.55),transparent 38%),
    radial-gradient(circle at 10% 20%,rgba(0,123,255,.18),transparent 30%),
    radial-gradient(circle at 90% 20%,rgba(255,106,0,.14),transparent 30%),
    linear-gradient(180deg,#03080d 0%,#06111d 45%,#03070d 100%);
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.18;
  background:
   repeating-linear-gradient(90deg,transparent 0 42px,rgba(255,255,255,.025) 43px 44px),
   radial-gradient(circle at 50% 100%,rgba(255,153,0,.18),transparent 30%);
}
.wrap{max-width:760px;margin:auto;padding:14px 14px 34px;position:relative;z-index:1}
.hero{text-align:center;padding:10px 0 8px}
.logo{
  font-weight:1000;font-size:48px;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff7b0,#ffd04c 38%,#ff9b00 68%,#7f3c00);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5a2700) drop-shadow(0 10px 18px rgba(255,159,0,.35));
  text-transform:uppercase;
}
.logo:before{content:"👑";display:block;font-size:52px;line-height:1;margin-bottom:-5px}
.sub{color:#f2f6fa;font-size:18px;margin-top:8px}
.arena-badge{
  display:inline-block;margin-top:5px;padding:5px 12px;border:1px solid #32668c;border-radius:999px;
  background:rgba(4,24,38,.85);color:#c9dced;font-size:13px
}
.card{
  background:linear-gradient(180deg,rgba(10,31,48,.97),rgba(3,15,25,.97));
  border:1px solid rgba(72,153,205,.34);border-radius:20px;padding:17px;margin:13px 0;
  box-shadow:0 12px 36px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.04)
}
.card.goldframe{border-color:#b36c00;box-shadow:0 0 0 1px #4a2500 inset,0 12px 40px rgba(255,153,0,.1)}
.btn{
  width:100%;padding:15px 16px;border:0;border-radius:15px;margin:7px 0;
  font-size:17px;font-weight:900;color:white;
  background:linear-gradient(180deg,#1f9cff,#075ba7);
  box-shadow:inset 0 1px rgba(255,255,255,.32),0 8px 18px rgba(0,80,160,.22);
}
.btn:disabled{opacity:.42}
.btn.green,.green{background:linear-gradient(180deg,#31ef72,#0a9c3e)}
.btn.gold,.gold{
  background:linear-gradient(180deg,#ffe276,#ffbe2b 48%,#d77700);
  color:#171008;border:1px solid #ffe3a0;
  box-shadow:0 7px 22px rgba(255,167,0,.25), inset 0 1px #fff5c2
}
.btn.dark,.dark{background:linear-gradient(180deg,#17466b,#0b2840)}
.btn.danger,.danger{background:linear-gradient(180deg,#ff5964,#b51128)}
input,select{
  width:100%;padding:14px;border-radius:13px;border:1px solid #275777;
  background:#04131f;color:white;margin:7px 0;font-size:16px
}
.row{display:flex;gap:10px}.row>*{flex:1}
.muted{color:var(--muted)}.center{text-align:center}
.code{
  font-size:36px;font-weight:1000;letter-spacing:7px;color:var(--gold);
  text-shadow:0 0 20px rgba(255,183,0,.35)
}
.question{
  font-size:28px;line-height:1.18;margin:16px 0;font-weight:850;
  text-shadow:0 2px 10px #000
}
.answer{
  width:100%;padding:15px;border:1px solid #2c6288;border-radius:14px;
  background:linear-gradient(180deg,#0a2940,#071a29);color:white;text-align:left;
  margin:7px 0;font-size:17px
}
.answer.sel{
  outline:2px solid #32e866;
  background:linear-gradient(180deg,#0db943,#066f29);
  box-shadow:0 0 20px rgba(44,255,108,.22)
}
.timer{
  width:78px;height:78px;border:6px solid var(--red);border-radius:50%;
  display:grid;place-items:center;margin:auto;font-size:30px;font-weight:1000;
  background:#07121d;box-shadow:0 0 18px rgba(255,35,65,.45), inset 0 0 14px #000
}
table{width:100%;border-collapse:collapse}
td{padding:12px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
.rank{font-size:22px}.winner{background:linear-gradient(90deg,rgba(255,185,0,.28),rgba(255,185,0,.05))}
.pill{
  display:inline-block;padding:6px 10px;border-radius:999px;background:#0d3451;
  color:#dceaf4;font-size:13px;border:1px solid #2d5d7e
}
.trophy{
  font-size:96px;filter:drop-shadow(0 10px 20px rgba(255,176,0,.35))
}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{
  min-height:92px;border-radius:16px;border:1px solid #2b6287;
  background:linear-gradient(180deg,#123a59,#071c2c);
  display:flex;align-items:flex-end;justify-content:center;padding:12px;
  font-weight:900;box-shadow:inset 0 1px rgba(255,255,255,.08)
}
.leaderboard-row{
  display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;
  padding:12px 8px;border-bottom:1px solid rgba(255,255,255,.08)
}
.leaderboard-row:first-child{
  background:linear-gradient(90deg,#6d3e00,#b86e00,#6d3e00);
  border-radius:12px;border:1px solid #ffd064
}
hr{border:0;border-top:1px solid rgba(255,255,255,.1)}
.small{font-size:13px}
.install-note{
  text-align:center;color:#bfd3e3;font-size:13px;margin-top:10px
}
@media(max-width:520px){
  .wrap{padding:10px 11px 26px}.logo{font-size:42px}.logo:before{font-size:46px}
  .question{font-size:25px}.card{border-radius:18px}.btn{font-size:16px}
}

.category-screen{padding-top:8px}
.category-title{text-align:center;margin:2px 0 14px}
.category-title h2{margin:4px 0;font-size:28px}
.category-title p{margin:0;color:var(--muted)}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.category-card{
 position:relative;min-height:128px;border-radius:18px;overflow:hidden;
 border:1px solid rgba(255,198,75,.42);
 background:radial-gradient(circle at 50% 16%,rgba(26,115,190,.3),transparent 38%),
 linear-gradient(180deg,#12334e 0%,#071725 75%,#050b12 100%);
 box-shadow:0 12px 28px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.07);
 color:white;padding:0
}
.category-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.15) 62%,rgba(0,0,0,.8) 100%)}
.category-icon{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:52px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
.category-name{position:absolute;z-index:2;left:8px;right:8px;bottom:12px;text-align:center;font-size:17px;font-weight:900;text-shadow:0 2px 8px #000}
.category-card.all{grid-column:1/-1;min-height:100px}
@media(max-width:520px){.category-card{min-height:116px}.category-icon{font-size:46px}.category-name{font-size:16px}}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.theme-choice{

 padding:14px;font-size:17px;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,.25)

.theme-choice .theme-icon{display:block;font-size:44px;margin-bottom:8px}
.theme-choice.selected{outline:3px solid var(--gold);box-shadow:0 0 25px rgba(255,190,50,.28)}
.theme-note{font-size:12px;color:var(--muted);font-weight:500;margin-top:5px}

function qaCurrentLanguage(){
  const urlLang=new URLSearchParams(location.search).get("lang");
  if(urlLang==="de" || urlLang==="no"){
    try{ localStorage.setItem(QA_LANG_KEY,urlLang); }catch(e){}
    return urlLang;
  }
  return localStorage.getItem(QA_LANG_KEY)==="de" ? "de" : "no";
}

function qaUpdateLanguageButtons(){
  const lang=qaCurrentLanguage();
  document.documentElement.lang=lang;
  document.documentElement.dataset.qaLang=lang;
  const noBtn=document.getElementById("qaLangNo");
  const deBtn=document.getElementById("qaLangDe");
  if(noBtn)noBtn.classList.toggle("active",lang==="no");
  if(deBtn)deBtn.classList.toggle("active",lang==="de");
}

function qaSetLanguage(lang){
  lang=lang==="de"?"de":"no";
  try{ localStorage.setItem(QA_LANG_KEY,lang); }catch(e){}
  const u=new URL(location.href);
  u.searchParams.set("lang",lang);
  location.href=u.toString();
}

function qaNormalizeText(s){
  return String(s||"").replace(/\s+/g," ").trim();
}

  const t=qaNormalizeText(raw);
  if(QA_DE_FIXED.has(t)) return QA_DE_FIXED.get(t);
  let m;
  if((m=t.match(/^Spørsmål (\d+) av (\d+)$/))) return `Frage ${m[1]} von ${m[2]}`;
  if((m=t.match(/^Runde (\d+) ferdig!$/))) return `Runde ${m[1]} beendet!`;
  if((m=t.match(/^Spillere \((\d+)\/(\d+)\)$/))) return `Spieler (${m[1]}/${m[2]})`;
  if((m=t.match(/^Dine feil \((\d+)\)$/))) return `Deine Fehler (${m[1]})`;
  if((m=t.match(/^Feil svar \((\d+)\)$/))) return `Falsche Antworten (${m[1]})`;
  if((m=t.match(/^Hei (.+)!$/))) return `Hallo ${m[1]}!`;
  return null;
}

async function qaFetchGerman(raw){
  raw=qaNormalizeText(raw);
  if(!raw)return raw;
  const fixed=qaFixedTranslate(raw);
  if(fixed)return fixed;
  if(qaTranslationCache.has(raw))return qaTranslationCache.get(raw);
  try{
    const saved=localStorage.getItem("qa_tr_"+raw);
    if(saved){qaTranslationCache.set(raw,saved);return saved;}
  }catch(e){}
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),1800);
    const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=no&tl=de&dt=t&q="+encodeURIComponent(raw);
    let r;
    try{
      r=await fetch(url,{cache:"force-cache",signal:controller.signal});
    }finally{
      clearTimeout(timeout);
    }
    if(!r.ok)return raw;
    const data=await r.json();
    const de=(data?.[0]||[]).map(x=>x?.[0]||"").join("").trim()||raw;
    qaTranslationCache.set(raw,de);
    try{localStorage.setItem("qa_tr_"+raw,de)}catch(e){}
    return de;
  }catch(e){
    return raw;
  }
}

function qaCollectTextNodes(){
  const root=document.getElementById("app");
  if(!root)return [];
  const nodes=[];
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const p=node.parentElement;
      if(!p || p.closest("script,style,noscript,textarea"))return NodeFilter.FILTER_REJECT;
      const t=qaNormalizeText(node.nodeValue);
      if(!t)return NodeFilter.FILTER_REJECT;
      if(/^[\d\s.,:;!?+\-*/=()%]+$/.test(t))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  while(walker.nextNode())nodes.push(walker.currentNode);
  return nodes;
}

async function qaTranslateVisible(){
  if(qaCurrentLanguage()!=="de" || qaTranslateBusy)return;
  qaTranslateBusy=true;
  try{
    const nodes=qaCollectTextNodes();
    await Promise.all(nodes.map(async node=>{
      if(!node.isConnected)return;
      const current=qaNormalizeText(node.nodeValue);
      if(!current)return;
      const de=await qaFetchGerman(current);
      if(node.isConnected && qaCurrentLanguage()==="de" && de && de!==current){
        node.nodeValue=node.nodeValue.replace(node.nodeValue.trim(),de);
      }
    }));

    const inputs=[...document.querySelectorAll("#app input[placeholder]")];
    await Promise.all(inputs.map(async el=>{
      if(!el.isConnected)return;
      const raw=el.getAttribute("placeholder")||"";
      const de=await qaFetchGerman(raw);
      if(el.isConnected && de)el.setAttribute("placeholder",de);
    }));
  }finally{
    qaTranslateBusy=false;
  }
}

function qaScheduleTranslation(){
  if(qaCurrentLanguage()!=="de")return;
  clearTimeout(qaTranslateTimer);
  qaTranslateTimer=setTimeout(qaTranslateVisible,80);
}

function qaStartStableLanguage(){
  qaUpdateLanguageButtons();
  const appRoot=document.getElementById("app");
  if(appRoot){
    new MutationObserver(()=>{
      if(!qaTranslateBusy)qaScheduleTranslation();
    }).observe(appRoot,{childList:true,subtree:true});
  }
  if(qaCurrentLanguage()==="de")qaScheduleTranslation();
}

document.addEventListener("DOMContentLoaded",qaStartStableLanguage);

function stopLivePolling(){
 if(livePolling){
   livePolling.active=false;
   clearTimeout(livePolling.next);
   livePolling.controller?.abort();
 }
 livePolling=null;
 clearInterval(poll);
 poll=null;
 connectionNotice();
}
async function quizRpc(name,args,signal){
 return await sb.rpc(name,args).abortSignal(signal);
}
function startLivePolling(request,consume,interval=1000,timeout=8000){
 stopLivePolling();
 const job={active:true,busy:false,again:false,next:null,controller:null};
 livePolling=job;
 job.refresh=async()=>{
   if(!job.active)return;
   if(job.busy){job.again=true;return}
   clearTimeout(job.next);
   job.busy=true;
   const controller=new AbortController();
   job.controller=controller;
   let deadline;
   try{
     const result=await Promise.race([
       request(controller.signal),
       new Promise((_,reject)=>{
         deadline=setTimeout(()=>{
           controller.abort();
           reject(new Error("Quiz request timed out"));
         },timeout);
       })
     ]);
     if(!job.active || livePolling!==job)return;
     if(result.error)throw result.error;
     connectionNotice();
     await consume(result.data);
   }catch(error){
     if(job.active && livePolling===job){
       connectionNotice("Forbindelsen er ustabil. Kobler til igjen automatisk…");
     }
   }finally{
     clearTimeout(deadline);
     job.busy=false;
     if(job.active && livePolling===job){
       const delay=job.again?0:interval;
       job.again=false;
       job.next=setTimeout(job.refresh,delay);
     }
   }
 };
 job.refresh();
 return job;
}
function refreshLiveQuiz(){
 if(livePolling?.active)livePolling.refresh();
}
document.addEventListener("visibilitychange",()=>{

});

let qaAudioCtx=null;
let qaAudioPrimed=false;
async function unlockQuizAudio(){
  try{
    if(!qaAudioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC) qaAudioCtx=new AC();
    }
    if(!qaAudioCtx)return;
    if(qaAudioCtx.state==="suspended") await qaAudioCtx.resume();

    // Prime iPhone/Safari audio during a real user gesture.
    if(!qaAudioPrimed && qaAudioCtx.state==="running"){
      const osc=qaAudioCtx.createOscillator();
      const gain=qaAudioCtx.createGain();
      gain.gain.value=0.00001;
      osc.connect(gain).connect(qaAudioCtx.destination);
      osc.start();
      osc.stop(qaAudioCtx.currentTime+0.025);
      qaAudioPrimed=true;
    }
  }catch(e){}
}
// Do not use {once:true}: Safari may suspend audio again after tab/app changes.
document.addEventListener("pointerdown",()=>{unlockQuizAudio();},{passive:true});
document.addEventListener("touchstart",()=>{unlockQuizAudio();},{passive:true});
document.addEventListener("keydown",()=>{unlockQuizAudio();},{passive:true});
window.addEventListener("pageshow",()=>{ if(qaAudioCtx?.state==="suspended") unlockQuizAudio(); });

const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const shuffle=a=>{
  const out=[...a];
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
};

function getRecentQuestionIds(){
  try{return JSON.parse(localStorage.getItem("qa_recent_question_ids")||"[]")}catch{return []}
}
function rememberQuestionIds(ids){
  const prev=getRecentQuestionIds();
  const merged=[...ids,...prev.filter(x=>!ids.includes(x))].slice(0,activeQuestionCatalog().length);
  localStorage.setItem("qa_recent_question_ids",JSON.stringify(merged));
}
function questionFamily(q){
  const id=q.id||"";
  if(id.startsWith("math_add_")) return "addition";
  if(id.startsWith("math_sub_")) return "subtraction";
  if(id.startsWith("math_mul_")) return "multiplication";
  if(id.startsWith("math_div_")) return "division";
  if(id.startsWith("pct_")) return "percent";
  if(id.startsWith("square_")) return "square";
  if(id.startsWith("seq_")) return "sequence";
  if(id.startsWith("geo_cap_")) return "capital";
  if(id.startsWith("geo_country_")) return "country";
  if(id.startsWith("sci_sym_")) return "element_name";
  if(id.startsWith("sci_name_")) return "element_symbol";
  if(id.startsWith("roman_")) return "roman";
  if(id.startsWith("unit_km_")) return "units";
  return q.category||"other";
}
function pickQuestionSet(diff,count){
  let pool=activeQuestionCatalog().filter(q=>{
    const fam=questionFamily(q);
    const noMath=!["addition","subtraction","multiplication","division","percent","square","sequence","units","roman"].includes(fam);
    if(diff==="mix") return noMath;
    return q.difficulty===diff && noMath;
  });
  const recent=new Set(getRecentQuestionIds());
  let fresh=pool.filter(q=>!recent.has(q.id));
  if(fresh.length<count) fresh=pool;

  // Build buckets by category, then by family.
  const byCategory={};
  for(const q of shuffle(fresh)){
    const cat=q.category||"Annet";
    (byCategory[cat]??=[]).push(q);
  }

  const categories=shuffle(Object.keys(byCategory));
  const picked=[];
  const usedFamilies=new Set();

  // First pass: one question from as many different categories as possible.
  for(const cat of categories){
    if(picked.length>=count) break;
    const candidates=byCategory[cat].filter(q=>!usedFamilies.has(questionFamily(q)));
    const q=(candidates[0]||byCategory[cat][0]);
    if(q){
      picked.push(q);
      usedFamilies.add(questionFamily(q));
      byCategory[cat]=byCategory[cat].filter(x=>x.id!==q.id);
    }
  }

  // Second pass: fill remaining spots while avoiding repeated families.
  let guard=0;
  while(picked.length<count && guard<500){
    guard++;
    let added=false;
    for(const cat of shuffle(categories)){
      if(picked.length>=count) break;
      const list=byCategory[cat]||[];
      let idx=list.findIndex(q=>!usedFamilies.has(questionFamily(q)));
      if(idx<0 && list.length) idx=0;
      if(idx>=0){
        const q=list.splice(idx,1)[0];
        picked.push(q);
        usedFamilies.add(questionFamily(q));
        added=true;
      }
    }
    if(!added) break;
  }

  // Final fallback, only if needed.
  if(picked.length<count){
    const used=new Set(picked.map(q=>q.id));
    for(const q of shuffle(fresh)){
      if(picked.length>=count) break;
      if(!used.has(q.id)){
        picked.push(q);
        used.add(q.id);
      }
    }
  }

  rememberQuestionIds(picked.map(q=>q.id));
  return picked;
}

let qaSelectedCategory=localStorage.getItem("qa_selected_category")||"";
function setQuizCategory(cat){
  qaSelectedCategory=cat||"";
  if(cat)localStorage.setItem("qa_selected_category",cat);
  else localStorage.removeItem("qa_selected_category");
}
function pickQuestionSetForCategory(diff,count,category){
  const blockedFamilies=new Set(["addition","subtraction","multiplication","division","percent","square","sequence","units","roman"]);
  const categoryPool=activeQuestionCatalog().filter(q=>{
    if(blockedFamilies.has(questionFamily(q))) return false;
    if(category && q.category!==category) return false;
    return true;
  });
  let pool=categoryPool.filter(q=>diff==="mix"||q.difficulty===diff);
  if(pool.length<count) pool=categoryPool;

  // Keep unseen questions first; reuse the oldest only when necessary.
  const recent=getRecentQuestionIds();
  const age=new Map(recent.map((id,i)=>[id,i]));
  const fresh=shuffle(pool.filter(q=>!age.has(q.id)));
  const older=pool.filter(q=>age.has(q.id)).sort((a,b)=>age.get(b.id)-age.get(a.id));
  const picked=[...fresh,...older].slice(0,count);
  rememberQuestionIds(picked.map(q=>q.id));
  return picked.map(q=>({...q,options:shuffle(q.options)}));
}

async function sharePendingInvite(){

  try{

      await navigator.share({title:"Marios QuizArena",text:`Bli med i Marios QuizArena, ${p.name}!`,url:p.url});
      return;
    }
  }catch(e){

  }
  try{
    await navigator.clipboard.writeText(p.url);
    alert("Invitasjonslenken er kopiert.");
  }catch{
    prompt("Kopier lenken:",p.url);
  }
}

async function createSession(){
 setPendingInvite(null);
 sessionStorage.setItem("qa_extra_invite_open","0");
 let qm=getQuizmasterName();
 if(!qm){
   qm=(document.getElementById("qmname")?.value||"").trim();
   if(!qm){alert("Skriv navnet ditt én gang.");return}
   setQuizmasterName(qm);
 }

 const diff=document.getElementById("diff").value;
 const limit=15;
 const qcount=Number(document.getElementById("qcount")?.value||10);
 const category=document.getElementById("hostCategory")?.value||"";

 localStorage.setItem("qa_host_category",category);

 const pool=pickQuestionSetForCategory(diff,qcount,category);
 if(pool.length<qcount){
   alert("For få spørsmål i denne kategorien ennå.");
   return;
 }

 const {data,error}=await sb.rpc("qa_create_session",{
   p_difficulty:diff,
   p_time_limit:limit,
   p_questions:pool
 });
 if(error){alert("Kunne ikke opprette quiz: "+error.message);return}

 const hostToken=data.host_token;
 const added=await sb.rpc("qa_add_player_live",{
   p_host_token:hostToken,
   p_name:qm,
   p_phone:null
 });
 if(added.error){
   alert("Quiz opprettet, men quizmaster kunne ikke legges til: "+added.error.message);
   return
 }

 let me=Array.isArray(added.data)?added.data[0]:added.data;
 if(me?.player && !me.player_token)me=me.player;
 if(me?.player_token)setHostPlayerToken(me.player_token);

 localStorage.setItem("qa_host_token",hostToken);
 location.href=location.pathname+"?host="+encodeURIComponent(hostToken)+"&lang="+encodeURIComponent(qaCurrentLanguage());
}

async function loadHost(token){
 startLivePolling(async signal=>{
   const result=await quizRpc("qa_host_state",{p_host_token:token},signal);
   const data=result.data;
   if(!result.error && data?.session && ["finished","closed"].includes(data.session.status)){
     const myTok=getHostPlayerToken();
     if(myTok){
       const mine=await quizRpc("qa_player_state",{p_code:data.session.code,p_player_token:myTok},signal);
       if(!mine.error && mine.data)data.host_player_state=mine.data;
     }
   }
   return result;
 },data=>{
   if(!data){
     app.innerHTML=`<main class="wrap"><div class="card"><h2>Kunne ikke hente quizen.</h2><button class="btn" onclick="location.href=location.pathname">Nytt spill</button></div></main>`;
     return;

   state=data;
   const a=document.activeElement;
   if(!(a&&["pname","pphone"].includes(a.id)))renderHost(token);
 });
}

function scheduleHostAutoAdvance(token,s){
  const key=`${s.round_no}:${s.current_index}`;
  if(hostAutoKey===key)return;
  hostAutoKey=key;
  if(hostAutoTimer)clearTimeout(hostAutoTimer);
  hostAutoTimer=setTimeout(async()=>{
    try{
      await hostNext(token);
    }catch(e){}
  },15000);
}
function stopHostAutoAdvance(){
  if(hostAutoTimer) clearTimeout(hostAutoTimer);
  hostAutoTimer=null;
  hostAutoKey="";
}


function playerPresence(p){
  if(!p?.joined_at)return {online:false,label:"⚪ Ikke tilkoblet"};
  const t=Date.parse(p.last_seen||p.joined_at||0);
  const online=Number.isFinite(t) && (Date.now()-t)<5000;
  return online
    ? {online:true,label:"🟢 Tilkoblet"}
    : {online:false,label:"⚪ Ikke tilkoblet"};
}

async function loadPlayer(){
 let lastSignature="";
 startLivePolling(
   signal=>quizRpc("qa_player_state",{p_code:code,p_player_token:playerToken},signal),
   data=>{
     if(!data?.session || !data?.player){
       app.innerHTML=`<main class="wrap"><div class="card"><h2>Invitasjonen virker ikke</h2><p class="muted">Be quizmaster sende en ny lenke.</p></div></main>`;
       return;
     }
     const old=state?.session;
     const incoming=data.session;
     // Do not move backwards if a backend response is briefly stale.
     if(old && (
       Number(incoming.round_no)<Number(old.round_no) ||
       (incoming.round_no===old.round_no && Number(incoming.current_index)<Number(old.current_index)) ||
       (incoming.round_no===old.round_no && ["finished","closed"].includes(old.status) && incoming.status==="live")
     ))return;
     if(incoming.status==="live" && (playerQuestionKey(old)!==playerQuestionKey(incoming) || old?.status!=="live")){
       selected="";
       seconds=incoming.time_limit_seconds||15;
       startedAt=Date.now();
     }
     state=data;
     const signature=JSON.stringify(data);
     if(signature!==lastSignature){
       lastSignature=signature;
       renderPlayer();
     }
   }
 );
}
function renderPlayer(){
 const s=state.session,p=state.player,q=state.question;
 const qd=qaQuestionDisplay(q,()=>{ if(state?.session?.status==="live") renderPlayer(); });
 if(s.status==="lobby"){app.innerHTML=`<main class="wrap"><div class="hero"><div class="logo"><span class="qa-owner">Marios</span>QuizArena</div></div><div class="card center"><div style="font-size:60px">⏳</div><h2>Hei ${esc(p.name)}!</h2><p>Venter på quizmaster.</p></div></main>`;return}
 if(s.status==="finished"||s.status==="closed"){renderResult();return}
 if(!timer)timer=setInterval(()=>{
   if(state?.session?.status!=="live" || state?.player?.answered_current)return;
   const limit=state.session.time_limit_seconds||15;
   const next=Math.max(0,Math.ceil((startedAt+limit*1000-Date.now())/1000));
   if(next===seconds)return;

 <button class="btn green" ${!selected||p.answered_current||seconds<=0||sendingAnswer?"disabled":""} onclick="sendAnswer()">${sendingAnswer?"Sender…":p.answered_current?"Svar sendt ✅":seconds<=0?"Tiden er ute":"Send svar"}</button>

}

async function sendAnswer(){unlockQuizAudio();
 if(!selected||seconds<=0||sendingAnswer||state?.session?.status!=="live")return;
 const questionKey=playerQuestionKey(state.session);
 const answer=selected;
 sendingAnswer=true;
 renderPlayer();
 const controller=new AbortController();
 let deadline;
 try{
   const result=await Promise.race([
     quizRpc("qa_submit_answer",{
       p_code:code,p_player_token:playerToken,p_answer:answer,
       p_response_ms:Math.max(0,Date.now()-startedAt)
     },controller.signal),
     new Promise((_,reject)=>{
       deadline=setTimeout(()=>{controller.abort();reject(new Error("Svar kunne ikke bekreftes"));},8000);
     })
   ]);
   if(result.error)throw result.error;
   if(livePolling?.active && questionKey===playerQuestionKey(state?.session)){
     state.player.answered_current=true;
   }
 }catch(error){
   if(livePolling?.active)connectionNotice("Svaret kunne ikke bekreftes. Henter svarstatus…");

   clearTimeout(deadline);

 }

async function playWinnerFanfare(){
  try{
    await unlockQuizAudio();
    const ctx=qaAudioCtx;
    if(!ctx)return false;
    if(ctx.state==="suspended"){
      try{ await ctx.resume(); }catch(e){}
    }
    if(ctx.state!=="running")return false;

    const now=ctx.currentTime+0.06;
    const master=ctx.createGain();
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.72,now+0.03);
    master.gain.setValueAtTime(0.72,now+1.85);
    master.gain.exponentialRampToValueAtTime(0.0001,now+2.28);
    master.connect(ctx.destination);

    // Stronger ceremonial winner fanfare, designed to remain audible on phones.
    const notes=[
      [392.00,0.00,0.23],[523.25,0.00,0.23],
      [493.88,0.24,0.23],[659.25,0.24,0.23],
      [587.33,0.48,0.28],[783.99,0.48,0.28],
      [783.99,0.82,0.24],[1046.50,0.82,0.24],
      [659.25,1.10,0.22],[880.00,1.10,0.22],
      [783.99,1.36,0.72],[1046.50,1.36,0.72]
    ];

    notes.forEach(([freq,start,dur],i)=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=(i%2===0)?"square":"sawtooth";
      osc.frequency.setValueAtTime(freq,now+start);
      gain.gain.setValueAtTime(0.0001,now+start);
      gain.gain.exponentialRampToValueAtTime(0.075,now+start+0.025);
      gain.gain.setValueAtTime(0.065,now+start+Math.max(.04,dur-.07));
      gain.gain.exponentialRampToValueAtTime(0.0001,now+start+dur);
      osc.connect(gain).connect(master);
      osc.start(now+start);
      osc.stop(now+start+dur+0.04);
    });

    // Ceremonial low hit.
    const bass=ctx.createOscillator(), bg=ctx.createGain();
    bass.type="sine";
    bass.frequency.setValueAtTime(130.81,now+0.80);
    bg.gain.setValueAtTime(0.0001,now+0.80);
    bg.gain.exponentialRampToValueAtTime(0.18,now+0.84);
    bg.gain.exponentialRampToValueAtTime(0.0001,now+2.05);
    bass.connect(bg).connect(master);
    bass.start(now+0.80);
    bass.stop(now+2.08);
    return true;
  }catch(e){
    return false;
  }
}

function startSolo(){
  unlockQuizAudio();
  const diff=document.getElementById("soloDiff")?.value||"mix";
  const count=Number(document.getElementById("soloCount")?.value||10);
  const pool=pickQuestionSetForCategory(diff,count,qaSelectedCategory);
  if(pool.length<count){
    alert("For få spørsmål i denne kategorien ennå.");
    return;
  }
  soloState={questions:pool,index:0,correct:0,selected:"",seconds:15,answers:[]};
  renderSolo();
}

function renderSolo(){
  if(!soloState)return;
  clearInterval(soloTimer);
  const s=soloState,q=s.questions[s.index];
  app.innerHTML=`<main class="wrap">
    <div class="hero"><div class="logo"><span class="qa-owner">Marios</span>QuizArena</div><p>Spørsmål ${s.index+1} av ${s.questions.length}</p></div>
    <div class="card">

      <div class="question">${esc(q.question)}</div>
      ${q.options.map((o,i)=>`<button class="answer ${s.selected===o?"sel":""}" onclick='soloPick(${JSON.stringify(o)})'><b>${"ABCD"[i]}.</b> ${esc(o)}</button>`).join("")}
      <button class="btn green" ${s.selected?"":"disabled"} onclick="soloSubmit()">Send svar</button>
    </div>
  </main>`;
  soloTimer=setInterval(()=>{
    if(!soloState)return;
    soloState.seconds--;
    const el=document.getElementById("soloSec");
    if(el)el.textContent=soloState.seconds;
    if(soloState.seconds<=0){
      clearInterval(soloTimer);
      soloSubmit(true);
    }
  },1000);
}

function soloPick(ans){
  if(!soloState)return;
  soloState.selected=ans;
  renderSolo();
}

function soloSubmit(timeout=false){
  if(!soloState)return;
  clearInterval(soloTimer);
  const s=soloState,q=s.questions[s.index];
  const ans=timeout?"":s.selected;
  const ok=ans===q.correct;
  if(ok)s.correct++;
  s.answers.push({question:q.question,answer:ans,correct:q.correct,ok});
  app.innerHTML=`<main class="wrap">
    <div class="card center">
      <div style="font-size:64px">${ok?"✅":"❌"}</div>
      <h2>${ok?"Riktig!":"Feil"}</h2>
      ${ok?"":`<p>Riktig svar: <b>${esc(q.correct)}</b></p>`}

    </div>
  </main>`;
}

function soloNext(){
  const s=soloState;
  if(s.index===s.questions.length-1){soloResult();return}
  s.index++;
  s.selected="";
  s.seconds=15;
  renderSolo();
}

    <div class="card center">
      <div class="trophy">${s.correct===s.questions.length?"🏆":"⭐"}</div>
      <h1>${s.correct}/${s.questions.length} riktig</h1>
      ${wrong.length?`<div style="text-align:left"><h3>Dine feil</h3>${wrong.map(x=>`<p><b>${esc(x.question)}</b><br><span class="muted">Ditt svar: ${esc(x.answer||"Ikke besvart")}</span><br><span style="color:#91efac">Riktig svar: ${esc(x.correct)}</span></p>`).join("<hr>")}</div>`:`<p>🎯 Alt riktig!</p>`}
    </div>
    <button class="btn green" onclick="soloHome()">Spill alene igjen</button>
    <button class="btn dark" onclick="home()">Hovedmeny</button>
  </main>`;
}

if(playerToken&&code)loadPlayer();
else if(hostParam)loadHost(hostParam);
else home();
</script>

</body>
</html>
